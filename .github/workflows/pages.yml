# Build the standalone web app and publish `dist/` to GitHub Pages.
#
# The site itself is a plain static directory, but it has to be *built* first:
# `src/` and `core/` are TypeScript/JSX, `app.js` is an esbuild bundle, and the
# alphaTab worker, soundfont and SMuFL fonts are copied out of `vendor/`.
# `dist/` is git-ignored, so GitHub Pages cannot serve the repository as it is -
# this workflow is that build step, plus the deployment of its output.
#
# One run per push to `main`; nothing runs while nothing is pushed.

name: pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Trim what the static site does not need: the source map (6.7 MB) and the
      # alphaTab ESM entry points (2.6 MB). alphaTab is already bundled into
      # app.js, and the offline audio exporter spawns a worker from the classic
      # `alphaTab.worker.js`. Verified by serving dist with those two files
      # missing: score playback, MIDI soundtrack synthesis and video export all
      # still work.
      - name: Prune unused assets
        run: rm -f dist/app.js.map dist/assets/alphaTab.mjs dist/assets/alphaTab.core.mjs

      # Fail loudly instead of deploying a half-empty site. The export worker in
      # particular comes from `vendor/alphaTab.worker.js`, which must be
      # committed; without it exports still "work" but lose the soundtrack.
      - name: Verify the bundle is complete
        run: |
          set -eu
          for f in index.html app.js app.css \
                   brand/favicon.svg \
                   assets/alphaTab.worker.js \
                   assets/soundfont/sonivox.sf2 \
                   assets/font/Bravura.woff2; do
            test -f "dist/$f" || { echo "missing dist/$f"; exit 1; }
          done
          # GitHub Pages rejects single files of 100 MB or more.
          if find dist -type f -size +99M | grep -q .; then
            echo "a file in dist/ exceeds the GitHub Pages per-file limit"
            exit 1
          fi
          du -sh dist
          echo "files: $(find dist -type f | wc -l)"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
