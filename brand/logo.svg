<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="-24 -24 560 560" role="img" aria-labelledby="title desc">
  <title id="title">Duck Score Motion</title>
  <desc id="desc">Light-blue guitar pick with a yellow duck silhouette: Duck Score Motion.</desc>

